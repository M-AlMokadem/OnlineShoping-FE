<section class="adm-page">
  <div class="adm-head">
    <h2>{{ 'adm.title.users' | t }}</h2>
    <app-search-field
        label="Search users"
        placeholder="Name or email"
        [value]="searchTerm()"
        (valueChange)="searchTerm.set($event)"
        (submitted)="search()"
      ></app-search-field>
  </div>

  <div class="card adm-card users-card">

    <app-user-form
      [value]="newUser()"
      [isSubmitting]="isCreating()"
      (saved)="createUser($event)"
    ></app-user-form>

    @if (isLoading()) {
      <app-page-state kind="loading" title="Loading users..." message="Fetching the latest directory entries."></app-page-state>
    } @else if (loadError()) {
      <app-page-state
        kind="error"
        title="Users could not be loaded"
        message="Check the API connection and try again."
        (retry)="search()"
      ></app-page-state>
    } @else if (users().length > 0) {
      <div class="adm-scroll">
        <table class="adm-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Status</th>
              <th class="row-actions">Action</th>
            </tr>
          </thead>
          <tbody>
            @for (user of users(); track user.id) {
              <tr>
                <td>{{ user.fullName }}</td>
                <td>{{ user.email }}</td>
                <td>
                  <span class="pill" [class]="'pill ' + (user.isActive ? 'pill-success' : 'pill-muted')">
                    {{ user.isActive ? 'Active' : 'Inactive' }}
                  </span>
                </td>
                <td class="row-actions">
                  <button class="btn-text" type="button" (click)="toggleStatus(user)">
                    {{ user.isActive ? 'Deactivate' : 'Activate' }}
                  </button>
                  <button class="btn-text danger" type="button" (click)="removeUser(user)">Delete</button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <app-pagination-controls
        [pageNumber]="pageNumber()"
        [pageSize]="pageSize()"
        [totalCount]="totalCount()"
        [totalPages]="totalPages()"
        (previous)="previousPage()"
        (next)="nextPage()"
      ></app-pagination-controls>
    } @else {
      <app-page-state kind="empty" title="No users found" message="Try a different search term or clear your filter."></app-page-state>
    }
  </div>
</section>
