@if (currentUser(); as user) {
	<div class="nav-user-card">
		<a class="avatar" routerLink="/account" [attr.aria-label]="'account.title' | t" [title]="user.email">{{ initials() }}</a>
		<a class="user-name" routerLink="/account">{{ user.fullName }}</a>
		<button type="button" class="logout-button" (click)="logout()">{{ 'account.logout' | t }}</button>
	</div>
} @else {
	<div class="guest-actions">
		<a class="register-button" routerLink="/register">{{ 'auth.register' | t }}</a>
		<a class="login-button" routerLink="/login">{{ 'auth.signIn' | t }}</a>
	</div>
}
